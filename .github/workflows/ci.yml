name: Validate catalog and API
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/subtitles/
            !/dist/subtitles/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/portal.test.cjs
      - run: python -m compileall -q subtitle_api tests
  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m subtitle_api.build --output .build/catalog --no-copy-subtitles
      - run: python -m subtitle_api.stage --catalog .build/catalog --output .build/pages
      - run: python -m subtitle_api.validate --directory .build/pages
