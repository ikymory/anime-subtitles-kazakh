name: Validate catalog and API
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/subtitles/
            !/dist/subtitles/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/portal.test.cjs
      - run: python -m compileall -q subtitle_api tests
  dataset:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m subtitle_api.build --output .build/catalog --no-copy-subtitles
      - run: python -m subtitle_api.stage --catalog .build/catalog --output .build/pages
      - run: python -m subtitle_api.validate --directory .build/pages
